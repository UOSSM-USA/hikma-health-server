# Lefthook configuration. Hooks are opt-in per clone — run once:
#
#   pnpm exec lefthook install
#
# CI is the authoritative enforcement; these local hooks are a courtesy that
# catches problems before they reach a PR.
# See https://lefthook.dev/configuration/ for the schema.

pre-commit:
  jobs:
    - name: vendor-check
      # Only fires when something under vendor/ or the vendor tool itself is
      # staged. Other commits skip the job. vendor-check verifies that every
      # mode = "sync" package in vendor/vendor.toml still matches its
      # recorded tree_sha — drift means an accidental local modification.
      glob:
        - "vendor/**"
        - "scripts/vendor/**"
      run: pnpm exec just vendor-check

