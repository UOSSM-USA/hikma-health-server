# flow: Shared _OnFlowStart
# intent:
# launch the app with a completely clear state and click through the Expo dev
# screens if needed (see _DismissExpoScreens.yaml). This is the non-seeding
# launcher used by backend-connected flows (real login, sync). For hermetic
# offline flows that need a seeded DB + injected session, use
# _OnFlowStartSeeded.yaml instead.
#
# Include in a flow header as:
#
# appId: ${MAESTRO_APP_ID}
# onFlowStart:
#   - runFlow: ../shared/_OnFlowStart.yaml
# ---
# [your maestro flow]
#
appId: ${MAESTRO_APP_ID}
---
# launch the app with a clean slate
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
    arguments:
      isE2E: "true"

- runFlow: _DismissExpoScreens.yaml
